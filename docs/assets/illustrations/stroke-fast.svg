<text x="105" y="92" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Тархины цус харвалт: FAST арга</text>
<text x="108" y="148" font-family="Arial, sans-serif" font-size="30" fill="#e0f2fe">Нүүр, гар, хэл яриа, цаг — 103 дуудна</text>
