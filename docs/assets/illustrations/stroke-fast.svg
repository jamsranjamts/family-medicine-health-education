<text x="270" y="715" font-family="Arial, sans-serif" font-size="26" fill="#334155" font-weight="400"><tspan x="270" dy="0">Үг ээрэх, ойлгомжгүй ярих, ойлгохгүй</tspan><tspan x="270" dy="32.5">болох.</tspan></text>
