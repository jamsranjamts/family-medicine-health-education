<text x="1080" y="345" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Гар</text>
<text x="1080" y="395" font-family="Arial, sans-serif" font-size="26" fill="#334155" font-weight="400"><tspan x="1080" dy="0">Нэг гар сулрах, өргөж чадахгүй болох.</tspan></text>
