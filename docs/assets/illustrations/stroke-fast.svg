<text x="270" y="345" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Нүүр</text>
<text x="270" y="395" font-family="Arial, sans-serif" font-size="26" fill="#334155" font-weight="400"><tspan x="270" dy="0">Нүүрний нэг тал унжих, инээхэд тэгш</tspan><tspan x="270" dy="32.5">бус болох.</tspan></text>
